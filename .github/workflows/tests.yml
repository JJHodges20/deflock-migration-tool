name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: deflock
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: deflock_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deflock -d deflock_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements.txt && pip install --no-deps ./backend
      - run: pytest -q
        working-directory: backend
        env:
          DEFLOCK_APP_ENV: test
          DEFLOCK_TEST_DATABASE_URL: postgresql+psycopg://deflock:ci-only@localhost:5432/deflock_test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run typecheck && npm test
        working-directory: apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet
      - run: docker compose build api
