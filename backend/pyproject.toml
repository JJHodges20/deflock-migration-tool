[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deflockmigration"
version = "0.1.0"
description = "DeFlockMigration backend - Denver pilot route planner (API, sync worker, migrations)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.143.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "sqlalchemy==2.1.4",
  "geoalchemy2==0.20.0",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.0",
  "httpx==0.28.1",
  "shapely==2.2.0",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
deflock-camera-sync = "deflockmigration.workers.camera_sync:main"
deflock-osm-download = "deflockmigration.workers.osm_download:main"
deflock-basemap-assets = "deflockmigration.workers.basemap_assets:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a PostGIS database reachable through DEFLOCK_DATABASE_URL",
  "live: calls a public provider; opt-in only, never in CI",
]
filterwarnings = ["error::DeprecationWarning:deflockmigration.*"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
