# Snapshot validation and assessment parameters (roadmap sections 8 and 9).
snapshot_validation:
  min_element_count: 1               # an empty result is never published automatically
  max_count_drop_fraction: 0.5       # quarantine when the ALPR count falls by more than 50 % versus the active snapshot
  stale_after_hours: 48              # Data Health flags the snapshot as stale beyond this age
  unresolved_disappearance: retain_as_uncertain   # a record missing from a new snapshot is "no longer mapped", not "removed"

proximity:
  candidate_radius_m: 50             # review parameter only; not a detection range
  sensitivity_radii_m: [25, 50, 100]
