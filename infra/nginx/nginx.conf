# DeFlockMigration edge: single localhost entry point for the web app, the API, and the basemap.
# Privacy: access logging is off so request paths, query strings (camera viewport bounding boxes),
# and tile coordinates are never written to disk.
worker_processes 1;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    types {
        application/vnd.pmtiles pmtiles;
        application/x-protobuf pbf;
    }
    default_type application/octet-stream;
    access_log off;
    error_log /dev/stderr warn;
    server_tokens off;
    sendfile on;
    client_max_body_size 64k;

    # Resolve service names through Docker's embedded DNS on every request, so a recreated api or web
    # container (new IP) is picked up without restarting the edge.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 3000;
        set $api_upstream http://api:8000;
        set $web_upstream http://web:3000;

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        location /api/ {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        location /basemap/ {
            alias /srv/basemap/;
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin "";
            gzip off;
        }

        location / {
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 60s;
        }
    }
}
